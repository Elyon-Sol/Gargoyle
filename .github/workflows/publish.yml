# Publish to PyPI by trusted publishing (OIDC): no API token is stored anywhere.
# One-time setup on pypi.org: Your projects -> Publishing -> add a pending
# publisher for project "gargoyle-receipts", owner Elyon-Sol, repository
# Gargoyle, workflow publish.yml, environment pypi. Then publishing a GitHub
# release (or running this workflow by hand) uploads that tag's build.
name: publish
on:
  release:
    types: [published]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
