[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gargoyle-receipts"
version = "0.5.3.dev0"
description = "Signed, single-use, argument-bound receipts and human-approval holds for agent tool calls."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Justin LaPorte" }]
keywords = ["agents", "mcp", "authorization", "receipts", "ed25519", "human-in-the-loop"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Security :: Cryptography",
]
# Floors, not pins: a library on PyPI must coexist with whatever else the
# installing environment holds. CI tests the floors and the latest.
dependencies = [
    "cryptography>=44.0.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "requests>=2.32",
]

[project.optional-dependencies]
redis = ["redis"]
entra = ["msal>=1.28"]
dev = ["httpx>=0.27", "pytest>=8", "redis"]

[project.urls]
Homepage = "https://github.com/Elyon-Sol/Gargoyle"
Source = "https://github.com/Elyon-Sol/Gargoyle"
Specification = "https://github.com/Elyon-Sol/Gargoyle/blob/main/SPEC.md"
Issues = "https://github.com/Elyon-Sol/Gargoyle/issues"

[project.scripts]
gargoyle = "gargoyle.cli:main"
gargoyle-approver = "gargoyle.approver_cli:main"

[tool.setuptools]
packages = ["gargoyle", "gargoyle.static"]

[tool.setuptools.package-data]
gargoyle = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
